version: '3'

tasks:
  default:
    cmds:
      - task: audit
      - task: test

  bootstrap:
    desc: Initialize the Python environment and install dependencies
    cmds:
      - uv sync

  init:
    desc: Copy .env.example to .env
    status:
      - test -f .env
    cmds:
      - cp .env.example .env

  audit:
    desc: Audit all formulas in the tap
    cmds:
      - task: audit:adguardhome-mcp-rs
      - task: audit:aria2-mcp-rs
      - task: audit:changedetection-mcp-rs
      - task: audit:cook-docs
      - task: audit:gatus-mcp-rs
      - task: audit:proxmox-mcp-rs
      - task: audit:qbittorrent-mcp-rs
      - task: audit:recipes-mcp-rs
      - task: audit:rescue-groups-mcp
      - task: audit:side-eye-host
      - task: audit:syncthing-mcp-rs
      - task: audit:sysmqttd
      - task: audit:tfa

  audit:adguardhome-mcp-rs:
    desc: Audit adguardhome-mcp-rs formula
    cmds:
      - brew audit nicholaswilde/tap/adguardhome-mcp-rs

  audit:aria2-mcp-rs:
    desc: Audit aria2-mcp-rs formula
    cmds:
      - brew audit nicholaswilde/tap/aria2-mcp-rs

  audit:changedetection-mcp-rs:
    desc: Audit changedetection-mcp-rs formula
    cmds:
      - brew audit nicholaswilde/tap/changedetection-mcp-rs

  audit:cook-docs:
    desc: Audit cook-docs formula
    cmds:
      - brew audit nicholaswilde/tap/cook-docs

  audit:gatus-mcp-rs:
    desc: Audit gatus-mcp-rs formula
    cmds:
      - brew audit nicholaswilde/tap/gatus-mcp-rs

  audit:proxmox-mcp-rs:
    desc: Audit proxmox-mcp-rs formula
    cmds:
      - brew audit nicholaswilde/tap/proxmox-mcp-rs

  audit:qbittorrent-mcp-rs:
    desc: Audit qbittorrent-mcp-rs formula
    cmds:
      - brew audit nicholaswilde/tap/qbittorrent-mcp-rs

  audit:recipes-mcp-rs:
    desc: Audit recipes-mcp-rs formula
    cmds:
      - brew audit nicholaswilde/tap/recipes-mcp-rs

  audit:rescue-groups-mcp:
    desc: Audit rescue-groups-mcp formula
    cmds:
      - brew audit nicholaswilde/tap/rescue-groups-mcp

  audit:side-eye-host:
    desc: Audit side-eye-host formula
    cmds:
      - brew audit nicholaswilde/tap/side-eye-host

  audit:syncthing-mcp-rs:
    desc: Audit syncthing-mcp-rs formula
    cmds:
      - brew audit nicholaswilde/tap/syncthing-mcp-rs

  audit:sysmqttd:
    desc: Audit sysmqttd formula
    cmds:
      - brew audit nicholaswilde/tap/sysmqttd

  audit:tfa:
    desc: Audit tfa formula
    cmds:
      - brew audit nicholaswilde/tap/tfa

  test:
    desc: Test all formulas in the tap
    cmds:
      - brew test $(basename -s .rb Formula/*.rb)
